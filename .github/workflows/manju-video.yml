name: Build and publish donghua sample
on:
  push:
    branches: [main]
    paths:
      - 'manju/render_video.py'
      - '.github/workflows/manju-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pillow numpy
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python manju/render_video.py
      - name: Commit generated MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manju/demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Publish Star Abyss animation MP4"
            git push
          fi
