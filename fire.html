const SEED = {"metadata":{"name":"湘安中级监控题库·个人学习整理版","version":"1.0","capturedQuestions":41,"withPlatformAnswers":29,"awaitingAnswers":12,"platformReportedSingleCount":320,"source":"用户提供的两段iPhone题库录屏及先前整理表格","notice":"本软件非学校官方产品。平台答案已按可见录屏整理，但尚未逐条独立依据现行规范复核。其余题目不冒充完整题库。"},"questions":[{"id":"XA-S-001","number":1,"type":"single","question":"（ ）是指响应悬浮在大气中燃烧和（或）热解产生的固体或液体微粒的探测器。","options":{"A":"火焰探测器","B":"感温火灾探测器","C":"感烟火灾探测器","D":"气体火灾探测器"},"answer":"C","topic":"火灾探测","explanation":"感烟探测器识别烟雾中的微粒；感温探测器主要响应温度变化，火焰探测器主要响应火焰辐射。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-002","number":2,"type":"single","question":"根据国家标准《火灾分类》（GB/T 4968—2008），按照可燃物质的类型和燃烧特性，将火灾分为以下（ ）种不同类别。","options":{"A":"5","B":"6","C":"7","D":"8"},"answer":"B","topic":"火灾基础","explanation":"这道题的依据是所列标准：A、B、C、D、E、F共六类。注意标准版本及教材变更。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-003","number":3,"type":"single","question":"电气火灾监控设备接收到探测器发送来的监控报警信号，监控报警信号具有（ ）显示级别。","options":{"A":"一般","B":"最高","C":"高","D":"最低"},"answer":"B","topic":"报警与联动","explanation":"本录屏平台给出的答案是“最高”。理解时应区分报警信号优先级与普通运行状态提示。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-004","number":4,"type":"single","question":"压力开关是一种水力驱动的压力传感装置，其作用是将系统中的（ ）转换为电信号，是报警阀组的主要组件之一。","options":{"A":"水流信号","B":"水压信号","C":"流速信号","D":"压强信号"},"answer":"B","topic":"自动喷水灭火","explanation":"压力开关感知的是水压变化，把压力状态转为电信号，供报警或控制环节使用。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-005","number":5,"type":"single","question":"微型消防站应建立24h值守制度，分班编组值守，每班不少于（ ）人。","options":{"A":"1","B":"3","C":"5","D":"7"},"answer":"B","topic":"消防管理","explanation":"录屏平台答案为3人。本题属于具体值守要求，复习时需结合适用的最新管理规范。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-006","number":6,"type":"single","question":"在供电电网经常发生断电的地区，计算机必须配置不间断电源，它的英文缩写是（ ）。","options":{"A":"UPS","B":"WPS","C":"LCD","D":"CFR"},"answer":"A","topic":"消防控制室","explanation":"UPS是不间断电源（Uninterruptible Power Supply），用于短时维持供电。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-007","number":7,"type":"single","question":"消防炮按（ ）不同分为消防水炮、消防泡沫炮和消防干粉炮三种。","options":{"A":"安装形式","B":"控制方式","C":"喷射介质","D":"设置位置"},"answer":"C","topic":"灭火设备","explanation":"水、泡沫、干粉是消防炮喷射的不同灭火介质，因此按喷射介质分类。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-008","number":8,"type":"single","question":"电气火灾监控设备液晶显示区域只有报警设备编码，而无设备注释信息时，正确的做法是（ ）。","options":{"A":"立刻打电话给119","B":"不用理会","C":"立即查看系统设备编码与保护场所（房间）对照表资料确定报警部位位置","D":"立即联系设备厂家"},"answer":"C","topic":"消防控制室","explanation":"只有编码时，先利用设备编码与房间位置对照表确定具体报警位置，不可凭空猜测。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-009","number":9,"type":"single","question":"当有某类报警信号输入时，在消防控制室图形显示装置上直接查看状态的专用总指示、总平面布局图中的建筑位置、建筑平面图上指示相应部位的物理位置显示情况，确定（ ）等信息。","options":{"A":"时间和编号","B":"编号","C":"部位和编号","D":"时间和部位"},"answer":"D","topic":"消防控制室","explanation":"录屏平台答案是“时间和部位”。查看报警信息应明确何时发生、发生在哪里。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-010","number":10,"type":"single","question":"以下不属于可燃气体报警系统组成的是（ ）。","options":{"A":"可燃气体报警控制器","B":"可燃气体探测器","C":"火灾声光报警器","D":"故障电弧探测器"},"answer":"D","topic":"火灾探测","explanation":"故障电弧探测器主要用于检测异常电弧，与可燃气体检测原理不同。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-011","number":11,"type":"single","question":"消防控制室设备的设备面板主体为（ ），无打印机、总线控制盘、多线控制盘等，则可判断该设备为消防控制室图形显示装置。","options":{"A":"按键","B":"开关","C":"液晶显示器","D":"操作按钮"},"answer":"C","topic":"消防控制室","explanation":"图形显示装置主要用于直观呈现图形、位置和报警信息，显示屏是重要外观线索。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-012","number":12,"type":"single","question":"承担火灾探测报警产品保养的企业应制订保养作业（ ）。","options":{"A":"指导书","B":"说明书","C":"申请书","D":"任务书"},"answer":"A","topic":"维护保养","explanation":"作业指导书用于明确保养步骤、检查内容、操作规范和质量要求。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-013","number":13,"type":"single","question":"一般情况下，当选择播音范围后，广播录放盘上“应急广播”即自动开启，对应指示灯（ ）点亮，消防广播按预先录制的信息进行播音。","options":{"A":"红色","B":"绿色","C":"黄色","D":"以上均不对"},"answer":"A","topic":"消防广播","explanation":"本录屏平台答案为红色。不同品牌设备的灯色、操作细节还须按设备说明书复核。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-014","number":14,"type":"single","question":"挡烟垂壁采用（ ）材料制成，垂直安装在建筑顶棚、梁或吊顶下，能在火灾时形成一定烟空间的挡烟分隔设施。","options":{"A":"易燃","B":"可燃","C":"难燃","D":"不燃"},"answer":"D","topic":"防烟排烟","explanation":"挡烟垂壁用于限制烟气蔓延，材料耐火性能要求高，平台答案为不燃材料。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-015","number":15,"type":"single","question":"机械加压送风系统应采用管道送风，送风管道应采用（ ）材料制作且内壁应光滑。","options":{"A":"可燃","B":"不燃","C":"不燃或难燃","D":"难燃"},"answer":"B","topic":"防烟排烟","explanation":"送风管道使用不燃材料，减少管道受火影响及引燃风险。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-016","number":16,"type":"single","question":"（ ）是通过采用机械加压送风方式阻止火灾烟气侵入楼梯间、前室、避难层（间）等空间的系统。","options":{"A":"自然排烟系统","B":"机械排烟系统","C":"自然通风系统","D":"机械加压送风系统"},"answer":"D","topic":"防烟排烟","explanation":"关键字是“机械加压送风”和“阻止烟气侵入”，对应机械加压送风系统。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-017","number":17,"type":"single","question":"湿式报警阀开启后，水力警铃的工作压力不应小于（ ）MPa。","options":{"A":"0.05","B":"0.07","C":"0.1","D":"0.15"},"answer":"A","topic":"自动喷水灭火","explanation":"平台给出的数值是0.05 MPa；此类数值题建议以现行规范和所用教材再次核实。","source":"第一段录屏","answerEvidence":"录屏平台答案","independentVerified":false,"notes":""},{"id":"XA-S-018","number":18,"type":"single","question":"环境温度不低于4℃且不高于70℃的场所，应采用（ ）。","options":{"A":"干式系统","B":"湿式系统","C":"预作用系统","D":"重复启闭预作用系统"},"answer":"B","topic":"自动喷水灭火","explanation":"湿式系统管网平时有水，适用于不易冻结且不处于过高温环境的场所。","sou  content+=list.map(x=>`<div class="card"><div class="meta"><span class="pill">第${E(x.number)}题</span><span class="pill bad">错误 ${saved.attempts[x.id]?.wrong||1} 次</span></div><b>${E(x.question)}</b><p class="small">${E(x.topic)}</p><div class="btnrow"><button class="btn alt" data-single="${E(x.id)}">重新练习</button><button class="btn outline" data-master="${E(x.id)}">已掌握 · 移除</button></div></div>`).join('');
 }
 main.innerHTML=`<div class="sectitle">我的错题本 <span class="hint">错误自动记录，需手动移除</span></div>`+content;bind();}
function knowledge(){if(detailTopic){let t=SEED.topics.find(x=>x.id===detailTopic),qs=all().filter(x=>t.numbers.includes(x.number));main.innerHTML=`<button class="btn outline" data-back="knowledge">← 返回知识点</button><div class="space"></div><div class="sectitle">${t.icon} ${E(t.title)}</div><div class="card"><b>新手理解</b><p>${E(t.summary)}</p><div class="review"><h4>记忆要点</h4><ul>${t.tips.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div class="space"></div><b>举一反三思路</b><p>${E(t.focus)}</p></div><div class="sectitle">关联题目 (${qs.length})</div>${qs.map(x=>`<div class="card"><div class="meta"><span class="pill">第${x.number}题</span><span class="pill ${checkable(x)?'ok':'wait'}">${checkable(x)?'可判题':'待核对'}</span></div><b>${E(x.question)}</b><div class="small">${checkable(x)?'平台答案：'+E(displayAnswer(x)):'答案未确认'}</div></div>`).join('')}`;bind();return}main.innerHTML=`<div class="sectitle">知识点速记 <span class="hint">按录屏题目归纳</span></div><div class="notice">这些是为了帮助新手理解而整理的学习笔记，尚未逐条对照最新版标准；涉及法规、数值及实操的内容应以现行规范与教学要求为准。</div>${SEED.topics.map(t=>`<button class="card" data-topic="${t.id}" style="width:100%;text-align:left;border:1px solid var(--line)"><b style="font-size:17px">${t.icon} ${E(t.title)}</b><p class="small" style="margin:5px 0">${E(t.summary)}</p><span class="pill">关联${t.numbers.length}题 · 查看要点 →</span></button>`).join('')}`;bind();}
function video(){main.innerHTML=`<div class="sectitle">视频与实操学习</div><div class="notice">之前收到的是<strong>刷题操作录屏</strong>，不是完整的老师授课或消防实操课程。真实课程视频尚未导入，不能假装已经整理完成。</div><div class="card"><b>▶ 播放手机本地视频</b><p class="small">选取手机“文件”中的MP4，即可在当前页面查看。视频不上传服务器，也不会自动保存到本地题库中。</p><label class="importer">选择视频文件播放<input class="file" type="file" id="videoPick" accept="video/*"></label><div id="video-player"></div></div><div class="card"><b>📼 录屏内容索引</b><div class="answerline">第1段（约78秒）：单选第1～20题 · 含部分答案及解析</div><div class="answerline">第2段（约117秒）：单选第21～41题 · 部分题未揭晓答案</div><p class="small">如果下载的是“含原始录屏版”压缩包，解压后可在对应录屏目录找到两个MP4文件。它们是题库采集证据，不是培训机构的授课视频。</p></div><div class="card"><b>授课课程 / 实操课程</b><p class="small">等待你补充实际课程视频或课程目录。导入的学习资料会与题库知识点建立关联。</p><span class="pill wait">尚无课程视频</span>${(saved.videos||[]).map(v=>`<div class="answerline"><a href="${E(v.url||'#')}" target="_blank" rel="noopener">${E(v.title||'学习视频')}</a></div>`).join('')}</div>`;const p=document.getElementById('videoPick');p.onchange=e=>{let f=e.target.files[0];if(!f)return;if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);videoName=f.name;document.getElementById('video-player').innerHTML=`<div class="space"></div><video controls playsinline src="${videoUrl}"></video><div class="small">${E(videoName)}</div>`};}
function data(){main.innerHTML=`<div class="sectitle">资料导入与备份</div><div class="card"><b>导入新增题目 / 试卷</b><p class="small">支持 .json 或 .csv。JSON可包含 questions、papers、videos 字段；CSV列名可用“题号、题型、题干、A、B、C、D、正确答案、解析、知识点、来源”。单选答案如A，多选如AC，判断用正确/错误。</p><label class="importer">➕ 选择 JSON 或 CSV 文件<input id="importPick" class="file" type="file" accept=".json,.csv,application/json,text/csv"></label><div class="space"></div><button class="btn outline" data-export="template">下载CSV导入模板</button><p class="small">不自动抓取原平台，须使用授权取得的题目和素材。重复id的题目会用导入版本更新。</p></div><div class="card"><b>导出与恢复</b><p class="small">导出题库包含当前已录入题目和知识点；学习记录包含错题、收藏、作答次数。更换手机或清除Safari网站数据前请备份。</p><div class="btnrow"><button class="btn alt" data-export="bank">导出题库JSON</button><button class="btn alt" data-export="records">备份学习记录</button></div><div class="space"></div><label class="importer">恢复学习记录JSON<input class="file" type="file" id="restorePick" accept=".json"></label></div><div class="card"><b>原始题库入口</b><p><a href="${E(BASE)}" target="_blank" rel="noopener">打开考考原题库 ↗</a></p><div class="small">不会要求输入账号密码到本软件，也不保存你的原平台登录信息。</div></div><div class="card"><b>本机数据管理</b><button class="btn danger" id="resetBtn">清除刷题记录（保留导入题库）</button></div><div class="notice">本软件并非湘安消防培训学校官方产品，仅供个人学习整理。平台答案已转录，不等于逐条通过现行标准核查。</div>`;bind();document.getElementById('importPick').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{await importFile(f);alert('导入成功！');render()}catch(ex){alert('导入失败：'+ex.message)}};document.getElementById('restorePick').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o.wrong||!o.attempts)throw Error('不是有效的学习记录文件');if(!confirm('恢复将覆盖当前错题与学习记录，是否继续？'))return;saved.wrong=o.wrong;saved.attempts=o.attempts;saved.bookmarks=o.bookmarks||{};saved.records=o.records||[];save();render();alert('学习记录已恢复')}catch(ex){alert('恢复失败：'+ex.message)}};document.getElementById('resetBtn').onclick=()=>{if(confirm('确定清除本机学习记录吗？此操作无法撤销。')){saved.wrong={};saved.attempts={};saved.bookmarks={};saved.records=[];save();render()}};}
function bind(){document.querySelectorAll('[data-navbtn]').forEach(b=>b.onclick=()=>go(b.dataset.navbtn));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>begin(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{view='knowledge';detailTopic=b.dataset.topic;render();window.scrollTo(0,0)});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{detailTopic=null;go('knowledge')});document.querySelectorAll('[data-single]').forEach(b=>b.onclick=()=>begin('only',b.dataset.single));document.querySelectorAll('[data-master]').forEach(b=>b.onclick=()=>{if(confirm('确定已经掌握并从错题本移除？')){delete saved.wrong[b.dataset.master];save();render()}});document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportAs(b.dataset.export));document.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{let p=saved.papers[+b.dataset.paper];begin('paper',p)})}
function begin(mode,param){let rs=ready(),list=[];if(mode==='pending'){view='practice';main.innerHTML=`<div class="sectitle">待核对题目 (${pending().length})</div><div class="notice">这里有答案尚未公布的题目，也有题干异常、暂不能计分的题目。蓝色选项不等于公布答案，这些题目暂不放入错题本。</div>${pending().map(x=>`<div class="card"><div class="meta"><span class="pill wait">第${x.number}题 · 待核对</span></div><b>${E(x.question)}</b>${optEntries(x).map(([k,v])=>`<p class="small">${E(k)}. ${E(v)}</p>`).join('')}<div class="small">${E(x.notes||'平台公布答案待补齐')}</div></div>`).join('')}`;nav();stats();window.scrollTo(0,0);return}
if(mode==='only')list=rs.filter(x=>x.id===param);else if(mode==='multiple')list=rs.filter(x=>x.type==='multiple');else if(mode==='judge')list=rs.filter(x=>x.type==='judge');else if(mode==='wrong')list=rs.filter(x=>saved.wrong[x.id]);else if(mode==='bookmarks')list=rs.filter(x=>saved.bookmarks[x.id]);else if(mode==='random')list=shuffle(rs);else if(mode==='exam')list=shuffle(rs).slice(0,Math.min(20,rs.length));else if(mode==='paper'){let ids=param.questions||param.questionIds||[];list=ids.map(id=>rs.find(q=>q.id===id||q.number===id)).filter(Boolean)}else list=rs;
if(!list.length){alert('当前分类还没有可判题数据，先导入对应题型或补齐答案。');return}quiz={mode,list,index:0,selected:[],revealed:false,answers:{}};render();window.scrollTo(0,0)}
function renderQuiz(){let x=quiz.list[quiz.index],i=quiz.index,total=quiz.list.length,exam=quiz.mode==='exam'||quiz.mode==='paper',s=quiz.selected,graded=quiz.revealed;main.innerHTML=`<div class="btnrow"><button class="btn outline" id="exitQ">← 返回</button><span class="pill right">${exam?'模拟试卷':'日常训练'} · ${i+1}/${total}</span></div><div class="space"></div><div class="progress"><div style="width:${((i+1)/total)*100}%"></div></div><div class="card" style="margin-top:14px"><div class="meta"><span class="pill">${typeOf(x)}</span><span class="pill">第${E(x.number)}题</span><span class="pill ok">平台答案可见</span><button id="fave" class="chip right">${saved.bookmarks[x.id]?'★ 已收藏':'☆ 收藏'}</button></div><div class="qtitle">${E(x.question)}</div><div class="space"></div>${optEntries(x).map(([k,v])=>`<button class="option ${s.includes(k)?'sel':''} ${graded&&ansOf(x).includes(k)?'correct':''} ${graded&&s.includes(k)&&!ansOf(x).includes(k)?'wrong':''}" data-opt="${E(k)}" ${graded?'disabled':''}><span>${E(k)}</span><span style="flex:1">${E(v)}</span></button>`).join('')}${graded?`<div class="feedback ${equal(x,s)?'good':'bad'}"><b>${equal(x,s)?'✓ 回答正确':'✗ 回答错误'} · 平台答案 ${E(displayAnswer(x))}</b><div>${E(x.explanation||'已记录平台答案，详细教材依据仍待核对。')}</div><div class="space"></div><span class="small">来源：${E(x.source||'用户导入')} · 答案来源：${E(x.answerEvidence||'导入数据')}<br>本题尚未独立完成现行规范核验。</span></div>`:''}<div class="space"></div><div class="btnrow">${!graded?`<button class="btn" id="submitQ" ${s.length?'':'disabled'}>${exam?'保存答案，下一题':'确认答案'}</button>`:`<button class="btn" id="nextQ">${i===total-1?'完成练习':'下一题 →'}</button>`}</div><div class="small" style="margin-top:10px">${x.type==='multiple'?'多选题：可以选择多个选项后提交':'单选/判断：点击一个选项'}</div></div>`;
document.getElementById('exitQ').onclick=()=>{if(confirm('退出当前练习？已提交的日常练习记录仍保存。'))go('practice')};document.getElementById('fave').onclick=()=>{if(saved.bookmarks[x.id])delete saved.bookmarks[x.id];else saved.bookmarks[x.id]=true;save();renderQuiz()};document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(graded)return;let k=b.dataset.opt;if(x.type==='multiple'){quiz.selected=s.includes(k)?s.filter(y=>y!==k):[...s,k]}else quiz.selected=[k];renderQuiz()});let b=document.getElementById('submitQ');if(b)b.onclick=()=>{if(!quiz.selected.length)return;if(exam){quiz.answers[x.id]=[...quiz.selected];if(quiz.index===total-1){finishExam();return}quiz.index++;quiz.selected=quiz.answers[quiz.list[quiz.index].id]||[];renderQuiz();window.scrollTo(0,0)}else{record(x,equal(x,quiz.selected));quiz.revealed=true;renderQuiz()}};let next=document.getElementById('nextQ');if(next)next.onclick=()=>{if(quiz.index>=total-1){go('home');return}quiz.index++;quiz.selected=[];quiz.revealed=false;renderQuiz();window.scrollTo(0,0)};
}
function finishExam(){let n=quiz.list.length,k=0;let results=quiz.list.map(x=>{let got=quiz.answers[x.id]||[],ok=equal(x,got);if(ok)k++;record(x,ok);return {id:x.id,n:x.number,question:x.question,selected:got.join(''),answer:displayAnswer(x),correct:ok}});saved.records.unshift({time:new Date().toISOString(),kind:'模拟试卷',total:n,correct:k});saved.records=saved.records.slice(0,40);save();quiz=null;view='practice';stats();nav();main.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:35px">📝</div><h2>模拟试卷已完成</h2><div style="font-size:44px;font-weight:850;color:var(--green)">${Math.round(k/n*100)}<span style="font-size:15px">分</span></div><div class="small">答对 ${k}/${n} · 错题已加入错题本</div><div class="space"></div><button class="btn" id="resultBack">返回专项训练</button></div><div class="sectitle">答题结果</div>${results.map(r=>`<div class="card"><span class="pill ${r.correct?'ok':'bad'}">第${r.n}题 · ${r.correct?'正确':'错误'}</span><div>${E(r.question)}</div><div class="small">你的答案：${E(r.selected||'未答')} · 平台答案：${E(r.answer)}</div></div>`).join('')}`;document.getElementById('resultBack').onclick=()=>go('practice');window.scrollTo(0,0)}
function download(name,data,type='application/json'){let b=new Blob([data],{type:type+';charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function exportAs(kind){if(kind==='records')return download('湘安消防_学习记录.json',JSON.stringify({wrong:saved.wrong,attempts:saved.attempts,bookmarks:saved.bookmarks,records:saved.records,created:new Date().toISOString()},null,2));if(kind==='bank')return download('湘安消防_题库数据.json',JSON.stringify({metadata:SEED.metadata,questions:all(),topics:SEED.topics,papers:saved.papers,videos:saved.videos},null,2));let rows=['题号,题型,题干,A,B,C,D,正确答案,解析,知识点,来源','示例-1,单选,火灾报警控制器主要用于（ ）,接收报警信息,播放音乐,通话聊天,处理财务,A,这是示例题并非原题,报警与联动,示例请删除'];download('题库导入模板.csv','\ufeff'+rows.join('\r\n'),'text/csv')}
function parseCSV(txt){let rows=[],r=[],cur='',inQ=false;for(let i=0;i<txt.length;i++){let c=txt[i];if(c==='"'){if(inQ&&txt[i+1]==='"'){cur+='"';i++}else inQ=!inQ}else if(c===','&&!inQ){r.push(cur);cur=''}else if((c==='\n'||c==='\r')&&!inQ){if(c==='\r'&&txt[i+1]==='\n')i++;r.push(cur);if(r.some(v=>v.trim()))rows.push(r);r=[];cur=''}else cur+=c}r.push(cur);if(r.some(v=>v.trim()))rows.push(r);return rows}
async function importFile(file){let txt=await file.text(),questions=[],papers=[],videos=[];if(file.name.toLowerCase().endsWith('.csv')){let rows=parseCSV(txt.replace(/^\ufeff/,'')),head=rows.shift()||[];let get=(row,names)=>{for(let n of names){let i=head.indexOf(n);if(i>=0)return(row[i]||'').trim()}return''};questions=rows.map((r,i)=>{let id=get(r,['题号','id'])||`CSV-${Date.now()}-${i}`;let t=get(r,['题型','type']);let kind=t.includes('多')?'multiple':t.includes('判断')?'judge':'single';let a=get(r,['正确答案','答案','answer']).toUpperCase();if(kind==='judge'){a=['正确','对','TRUE','T'].includes(a)?'A':['错误','错','FALSE','F'].includes(a)?'B':a}let opts={};'ABCD'.split('').forEach(k=>opts[k]=get(r,[k,`${k}选项`]));return{id:'IMPORT-'+id,number:id,type:kind,question:get(r,['题干','题目','question']),options:opts,answer:a||null,explanation:get(r,['解析','explanation']),topic:get(r,['知识点','topic'])||'待分类',source:get(r,['来源','source'])||'CSV导入',answerEvidence:'用户导入，未独立复核',independentVerified:false}})}else{let data=JSON.parse(txt);questions=Array.isArray(data)?data:(data.questions||[]);papers=data.papers||[];videos=data.videos||[]}
questions=questions.filter(x=>x&&x.question&&x.id).map(x=>{let y={...x};if(!y.type)y.type='single';if(Array.isArray(y.options))y.options=Object.fromEntries(y.options.map((v,i)=>['ABCD'[i],v]));if(y.type==='judge'&&!y.options)y.options={A:'正确',B:'错误'};if(typeof y.answer==='string')y.answer=y.answer.toUpperCase().replace(/[^A-D正确错误]/g,'');return y});if(!questions.length&&!papers.length&&!videos.length)throw Error('没有有效题目/试卷/视频数据');if(questions.length>15000)throw Error('单次导入超过15000题，请分批');let current=new Map((saved.imported||[]).map(x=>[x.id,x]));questions.forEach(x=>current.set(x.id,x));saved.imported=Array.from(current.values());saved.papers=[...(saved.papers||[]),...papers];saved.videos=[...(saved.videos||[]),...videos];save()}
render();
})();
</script></body></html>
