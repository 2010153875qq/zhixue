<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1020"><title>星渊觉醒 · 国漫样片</title><style>*{box-sizing:border-box}body{margin:0;background:#080e20;color:#f1f5ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:580px;margin:auto;padding:18px}h1{margin:8px 0;font-size:26px}.tag{font-size:12px;color:#a3b4ef}.screen{margin:16px auto;background:#11162b;border:1px solid #354264;border-radius:18px;overflow:hidden;max-width:410px}video{width:100%;display:block;aspect-ratio:480/854;background:#080e20}.note{background:#19243e;border-radius:12px;padding:14px;color:#ced7ef;line-height:1.7}a{color:#b8beff}.btn{display:inline-block;background:#6650da;color:white;padding:12px 18px;border-radius:10px;text-decoration:none;margin:12px 8px 12px 0}.secondary{background:#334766}small{color:#a4afc8}</style></head><body><div class="wrap"><div class="tag">🎬 漫剧工坊 · 原创国漫短片</div><h1>《星渊觉醒》第一集 · 觉醒</h1><p>32 秒 · 竖屏 · 中文字幕 · 原创配乐</p><div class="screen"><video id="player" controls playsinline preload="auto" webkit-playsinline poster="cover.svg"><source src="demo.mp4" type="video/mp4">当前浏览器不支持视频。</video></div><a class="btn" href="demo.mp4">▶ 播放 / 打开 MP4</a><a class="btn secondary" href="./">返回漫剧工坊</a><button id="voice" class="btn secondary" style="border:0;cursor:pointer">🔊 用 iPhone 中文语音朗读</button><p id="status" style="color:#b3c9f6">正在检查 MP4 是否可播放……</p><div class="note"><b>剧情简介</b><p>星渊裂缝突然降临，少年林澈听见古老的召唤。神秘少女苏璃试图阻止他，但林澈选择拔剑，迎向黑暗。</p><small>说明：这是程序绘制、逐帧渲染的原创动态国漫分镜短片，不是 AI 视频模型生成的高帧率成品，也尚未包含真人式中文对白配音。背景音乐和字幕已加入 MP4。</small></div></div><script>const video=document.getElementById("player"),status=document.getElementById("status");const script=[["千年星渊，正在苏醒。",0],["而他，终于听见命运的召唤。",4],["苏璃：林澈，你真的要进去吗？",8],["林澈：这一次，我不会再逃。",13],["黑暗吞没高塔，星火划破长夜。",17],["林澈：以星为刃，斩开黑夜！",22],["星渊觉醒，第一集，觉醒。",28]];let spoken=-1,enableVoice=false;document.getElementById("voice").onclick=()=>{enableVoice=!enableVoice;spoken=-1;document.getElementById("voice").textContent=enableVoice?"🔇 关闭系统语音朗读":"🔊 用 iPhone 中文语音朗读";if(enableVoice){video.muted=true;video.play().catch(()=>{});}else{speechSynthesis.cancel();video.muted=false}};video.addEventListener("timeupdate",()=>{if(!enableVoice||!window.speechSynthesis)return;const i=script.findLastIndex(x=>x[1]<=video.currentTime);if(i>spoken){spoken=i;speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(script[i][0]);utter.lang="zh-CN";utter.rate=.90;speechSynthesis.speak(utter)}});video.addEventListener("ended",()=>speechSynthesis.cancel());video.onloadedmetadata=()=>status.textContent="✅ 视频已加载，点击播放即可观看。";video.onplaying=()=>status.textContent="▶ 正在播放 · 如果画面卡顿可暂停片刻再播放";video.onerror=()=>status.innerHTML="视频还没有成功发布到 GitHub Pages。页面本身已经上线，请查看生成状态：<a href=\"https://github.com/2010153875qq/zhixue/actions/workflows/manju-video.yml\">视频生成记录</a>。";</script></body></html>
